# agy procedural configuration for this project.
# The hooks in hooks/hook.py read this file. Every key is optional.
#
# HOOKS       which hooks.json the installer lays down (see .agents/README.md):
#             guard-only = destructive-command denial only (cheap, default)
#             gates      = guard plus the plan gate and the stop gate (costly)
#             This key is read by the installer, not by the hooks.
# PLAN_GATE   on|off (only meaningful with HOOKS=gates) — refuse the first edit of a session until a one-line plan
#             has been recorded with `sh .agents/hooks/plan.sh '...'`
# VERIFY_CMD  the command a human would name as "does it still work" (scripts/gate.sh fits)
# VERIFY_RE   commands that count as verification (auto-approved, and they
#             satisfy the stop gate when they succeed)
# ALLOW_RE    commands safe to auto-approve; unset means read-only inspection only
# DENY_RE     extra commands to hard-deny, on top of the built-in destructive set
#
# The stop gate only engages when VERIFY_CMD is set. Leave it empty in projects
# that have nothing to run.

HOOKS=guard-only
PLAN_GATE=off
VERIFY_CMD=
VERIFY_RE=
ALLOW_RE=
DENY_RE=
