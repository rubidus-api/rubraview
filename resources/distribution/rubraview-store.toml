# Explorer's right-click menu (RV-113 (3)): the items of MENU_ITEMS in
# src/core/shellreq.c, each on the extensions of its kinds (SHELL_GROUPS in
# src/core/filemanage.c; scripts/check-store.py compares them). One run with
# every selected file, and --whole: nothing more is coming. Windows 11 puts
# a package's items for one kind of file under one entry, the product's name.
# The IDs sort in the menu's order: rubrapack lists the verbs by ID.
# A selection too long for one command line (32K characters) goes in a
# list file instead (rubrapack 0.48.0 `list`, RV-124): the menu DLL writes
# one path a line under %TEMP%, and --paths-temp has the program delete it.
# hide-when: while the installer's copy has its own Windows 11 menu (the
# program writes that value then), these items step aside (RV-124).

[menu.M1Open]
on = [
    ".jpg", ".jpeg", ".png", ".apng", ".gif", ".bmp", ".tif", ".tiff",
    ".webp", ".avif", ".jxl", ".ico", ".cbz", ".cb7", ".cbr", ".mp4",
    ".mkv", ".webm", ".avi", ".mov", ".wmv", ".asf", ".mpg", ".mpeg",
    ".mp3", ".flac", ".wav", ".ogg", ".opus", ".m4a", ".txt", ".log", ".nfo", ".md", ".zip", ".7z", ".rar", ".alz", ".egg",
]
text = "Open"
text-ko = "열기"
target = "file:App"
args = "--open --whole %*"
multi = "one"
list = "--paths-temp --paths-from=%L"
hide-when = "HKLM\\Software\\Rubraview\\Win11Menu\\Registered"

[menu.M2NewWindow]
on = [
    ".jpg", ".jpeg", ".png", ".apng", ".gif", ".bmp", ".tif", ".tiff",
    ".webp", ".avif", ".jxl", ".ico", ".cbz", ".cb7", ".cbr", ".mp4",
    ".mkv", ".webm", ".avi", ".mov", ".wmv", ".asf", ".mpg", ".mpeg",
    ".mp3", ".flac", ".wav", ".ogg", ".opus", ".m4a", ".txt", ".log", ".nfo", ".md", ".zip", ".7z", ".rar", ".alz", ".egg",
]
text = "Open in a new window"
text-ko = "새 창에서 열기"
target = "file:App"
args = "--new-window --whole %*"
multi = "one"
list = "--paths-temp --paths-from=%L"
hide-when = "HKLM\\Software\\Rubraview\\Win11Menu\\Registered"

[menu.M3OpenOnly]
